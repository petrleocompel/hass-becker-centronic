name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-zip:
    name: Attach component zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create zip
        working-directory: custom_components/becker_centronic
        run: zip -r becker_centronic.zip . -x "__pycache__/*"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: custom_components/becker_centronic/becker_centronic.zip
